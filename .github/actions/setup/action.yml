name: Set up
description: Node, the project's dependencies and the pinned builds of the smalt repositories, after a checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    # smaltdb and sibling plugins are not on npm yet: build the commits pinned in packed.json and install them. Kept by
    # the pins, so only the first jobs after the pins move build them (a minute and a half).
    - uses: actions/cache@v4
      with:
        path: |
          .cache/packed/*.tgz
          .cache/packed/*-files
        key: packed-${{ hashFiles('packed.json') }}
    - run: node scripts/fetch-packed.mjs
      shell: bash
