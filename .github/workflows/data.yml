name: Data

# Downloads the scenario's data (scripts/data/build.py) and publishes it as the `data` branch: one new commit on top of
# the last on every run, so every data commit a run or an audit bag names stays fetchable (ADR 0009, the owner's
# "we should always be able to get back to what was true"). It runs on GitHub's runners because they can reach the data hosts. It runs when the script or this file
# changes, or on demand. The history (each day's numbers for two years and a quarter) is measured on the runtime, in
# Node, so the job installs the project as CI does.
on:
  push:
    paths:
      - '.github/workflows/data.yml'
      - 'scripts/data/**'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to fetch (YYYY-MM)'
        default: '2024-01'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow==18.1.0
      - run: python scripts/data/build.py out "${{ github.event.inputs.month || '2024-01' }}" work
      - name: Publish the data branch
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git symbolic-ref HEAD refs/heads/data
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The new commit's parent is the branch as it is: its tree is this run's files alone, its history every run's.
          if git fetch -q --depth 1 origin data; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Data for $(jq -r .month MANIFEST.json), built $(jq -r .built MANIFEST.json) from ${GITHUB_SHA::7}"
          git push -q origin HEAD:data
