name: Docs

# The site (VitePress, docs/) and the two demos beside it, deployed to GitHub Pages at stenhoor.github.io/smaltfl/:
# the control estate at /app/ and the sign-in log at /signins/. Each demo's data is generated from its fixed seed by
# the build (scripts/data/estate.ts, scripts/data/security.ts), its history measured on the runtime.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'examples/**', 'scripts/**', 'test/fixtures/**', 'packed.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run docs:build
      - run: npm run build:app -- --flow examples/control-estate/flow.json --out docs/.vitepress/dist/app
      - run: npm run build:app -- --flow examples/security-signins/flow.json --out docs/.vitepress/dist/signins
      # Every page and file the demos load answers: a demo that can't load its data is a broken site.
      - run: |
          for d in app signins; do
            test -f docs/.vitepress/dist/$d/index.html
            test -f docs/.vitepress/dist/$d/data/flow.json
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
