name: Docs

# The site (VitePress, docs/) and the three demos beside it, deployed to GitHub Pages at stenhoor.github.io/smaltfl/:
# Larkspur at /app/ (ADR 0020), the control estate at /estate/ (ADR 0014's answer key, kept as a regression, Q-169) and
# the sign-in log at /signins/. Each demo's data is generated from its fixed seed by the build
# (scripts/data/larkspur.mjs, scripts/data/estate.ts, scripts/data/security.ts), its histories measured on the runtime.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'examples/**', 'scripts/**', 'test/fixtures/**', 'packed.json', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      # The demos' generated days and histories, kept by what makes them (scripts/build-app.mjs checks its own hash of the
      # same inputs, so a stale folder is never used): a change to the app alone deploys without measuring them again.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/smaltfl/data
          key: demo-data-${{ hashFiles('scripts/data/**', 'scripts/flow.ts', 'src/core/**', 'src/plugin/**', 'src/notebook.ts', 'src/index.ts', 'examples/**', 'test/fixtures/**', 'packed.json', 'package-lock.json') }}
          restore-keys: demo-data-
      - run: npm run docs:build
      - run: npm run build:app -- --flow examples/larkspur/flow.json --out docs/.vitepress/dist/app
      - run: npm run build:app -- --flow examples/control-estate/flow.json --out docs/.vitepress/dist/estate
      - run: npm run build:app -- --flow examples/security-signins/flow.json --out docs/.vitepress/dist/signins
      # Every page and file the demos load answers: a demo that can't load its data is a broken site.
      - run: |
          for d in app estate signins; do
            test -f docs/.vitepress/dist/$d/index.html
            test -f docs/.vitepress/dist/$d/data/flow.json
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
