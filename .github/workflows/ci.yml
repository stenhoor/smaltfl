name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # smaltdb and sibling plugins are not on npm yet: build the commits pinned in packed.json and install them.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Beside `test`, so neither waits on the other: the month-long runs `npm test` leaves out (vitest.config.ts, SLOW),
  # then every file again in a fresh module graph, which rules out a test leaning on another file's state.
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run test:slow
      - run: npm run test:isolated

  # Beside the others: the tour's two months at the demo's own scale (test/larkspur-tour.test.ts, ADR 0023), its data made
  # as the app build makes it and its answer key checked. The demo's scale is the point: at the tests' smaller one a register
  # of sixty rows moves by a twentieth when five exceptions are approved, which the demo's never does.
  tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run test:tour

  # The five demos the browser regression runs on (tools/browser/sets.json), built once for every job below. Their
  # generated days and histories are kept by what makes them, as the docs deploy keeps them (docs.yml): a change to the
  # app alone builds in seconds.
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/smaltfl/data
          key: demo-data-${{ hashFiles('scripts/data/**', 'scripts/flow.ts', 'src/core/**', 'src/plugin/**', 'src/notebook.ts', 'src/index.ts', 'examples/**', 'test/fixtures/**', 'packed.json', 'package-lock.json') }}
          restore-keys: demo-data-
      - run: node tools/browser/regress.cjs --build-only
      - run: tar -C node_modules/.cache/smaltfl -cf demos.tar apps
      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: demos.tar
          retention-days: 1

  # The browser regression (ADR 0025): every stop set in the built demos, in a real browser. `session` is the run a
  # session makes before a PR (`npm run regress`: each set once on a phone, its layout at the other sizes by resizing
  # the page); the others replay every set at one more size each, as a person at that size reaches it. A size a job, so
  # the whole matrix takes the time of one pass: five to nine minutes of regression a job on these machines with the
  # 22 sets of ADR 0025, ten and a half to fourteen with ADR 0026's eleven (629 to 834 s on 2026-11-17, a third apart
  # from one machine to the next), and a job that takes thirty is stopped as failed (the sets' runs are budgeted in
  # tools/browser/sets.json; this is the clock's say, raised from twenty with the budget, ADR 0025's amendment).
  browser:
    needs: demos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pass: [session, tablet, tablet-wide, desktop, wide]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      # Playwright and its Chromium, for this job alone: the tools ask for `playwright` as a session has it, installed
      # beside the project, not in it (tools/README.md).
      - run: |
          npm install -g playwright@1.63.0
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: demos
      - run: mkdir -p node_modules/.cache/smaltfl && tar -C node_modules/.cache/smaltfl -xf demos.tar
      - if: matrix.pass == 'session'
        run: node tools/browser/regress.cjs
      - if: matrix.pass != 'session'
        run: node tools/browser/regress.cjs --full --sizes ${{ matrix.pass }}
      # What failed, to look at: each job's log and metrics, and a screenshot of every stop that reported a problem.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regress-${{ matrix.pass }}
          path: node_modules/.cache/smaltfl/regress
          retention-days: 7
