<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 470" role="img" aria-label="Larkspur’s five kinds of things and their relations as a map, comparing Friday March 1 with Monday April 1: the control list gained an entry, the meaning of an application’s exposure changes, and a new relation between a person and a control is coming." width="944" height="470"><style>svg{--bg:#f4f5f8;--surface:#ffffff;--sunk:#eceff5;--ink:#151922;--ink-2:#3f4656;--muted:#5c6375;--line:#d6dbe4;--smalt:#003399;--smalt-wash:#e0e6f3;--teal:#006861;--teal-fill:#00786f;--teal-wash:#dcefed;--ok:#1d6b3a;--warn:#8a5a12;--bad:#a3195b;--bad-wash:#f8e3ec;--row-alt:#f6f7fa;--plum:#6b3fa0;--plum-wash:#ece4f6;}@media (prefers-color-scheme: dark){svg{--bg:#0f131a;--surface:#171c25;--sunk:#1e2430;--ink:#e8ebf1;--ink-2:#c3c9d6;--muted:#98a1b3;--line:#434955;--smalt:#8fa8ff;--smalt-wash:#1d2742;--teal:#4fd1c5;--teal-fill:#2bb3a6;--teal-wash:#14302e;--ok:#67d391;--warn:#e3b55f;--bad:#ff86b5;--bad-wash:#3a1828;--row-alt:#1b212b;--plum:#c4a3f0;--plum-wash:#2a2140;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.t-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}.t-mut{fill:var(--muted)}.t-2{fill:var(--ink-2)}
.t-lane{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}.wk{fill:var(--sunk)}
.band-ev{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1}
.band-rule{fill:var(--smalt-wash);stroke:var(--smalt);stroke-width:1}
.band-rule-was{fill:none;stroke:var(--smalt);stroke-width:1.2;stroke-dasharray:3 3}
.band-hold{fill:var(--bad-wash);stroke:var(--bad);stroke-width:1}
.band-coming{fill:url(#hatch);stroke:var(--smalt);stroke-width:1.2;stroke-dasharray:4 3}
.band-wait{fill:var(--surface);stroke:var(--smalt);stroke-width:1.3;stroke-dasharray:1.5 3;stroke-linecap:round}
.tick-ev{fill:var(--ink-2)}.tick-rule{fill:var(--smalt)}.tick-dec{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}.tick-rest{fill:var(--bad)}
.link{stroke:var(--muted);stroke-width:1;fill:none}.link-dash{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:2 3}
.now{stroke:var(--ink);stroke-width:1.5}.surface{fill:var(--surface)}.ink{fill:var(--ink)}
.line-main{stroke:var(--teal-fill);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dot-main{fill:var(--teal-fill);stroke:var(--surface);stroke-width:2}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}.box-smalt{fill:var(--smalt-wash);stroke:var(--smalt);stroke-width:1}
.box-sunk{fill:var(--sunk);stroke:var(--line);stroke-width:1}.box-bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:1}
.arrow{stroke:var(--ink-2);stroke-width:1.3;fill:none}.arrowhead{fill:var(--ink-2)}
</style><rect width="944" height="470" rx="10" style="fill: var(--surface); stroke: var(--line)"/>
