<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 520 470" role="img" aria-label="Why the WAF band held from Monday 18: an event on Tuesday 12, a held day, a decision, the security lead’s choice on Thursday 14, the change recorded on Friday 15 with a trial on the last seven days, in force from Monday 18." width="520" height="470"><style>svg{--bg:#f4f5f8;--surface:#ffffff;--sunk:#eceff5;--ink:#151922;--ink-2:#3f4656;--muted:#5c6375;--line:#d6dbe4;--smalt:#003399;--smalt-wash:#e0e6f3;--teal:#006861;--teal-fill:#00786f;--teal-wash:#dcefed;--ok:#1d6b3a;--warn:#8a5a12;--bad:#a3195b;--bad-wash:#f8e3ec;--row-alt:#f6f7fa;--plum:#6b3fa0;--plum-wash:#ece4f6;}@media (prefers-color-scheme: dark){svg{--bg:#0f131a;--surface:#171c25;--sunk:#1e2430;--ink:#e8ebf1;--ink-2:#c3c9d6;--muted:#98a1b3;--line:#434955;--smalt:#8fa8ff;--smalt-wash:#1d2742;--teal:#4fd1c5;--teal-fill:#2bb3a6;--teal-wash:#14302e;--ok:#67d391;--warn:#e3b55f;--bad:#ff86b5;--bad-wash:#3a1828;--row-alt:#1b212b;--plum:#c4a3f0;--plum-wash:#2a2140;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.t-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}.t-mut{fill:var(--muted)}.t-2{fill:var(--ink-2)}
.t-lane{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}.wk{fill:var(--sunk)}
.band-ev{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1}
.band-rule{fill:var(--smalt-wash);stroke:var(--smalt);stroke-width:1}
.band-rule-was{fill:none;stroke:var(--smalt);stroke-width:1.2;stroke-dasharray:3 3}
.band-hold{fill:var(--bad-wash);stroke:var(--bad);stroke-width:1}
.band-coming{fill:url(#hatch);stroke:var(--smalt);stroke-width:1.2;stroke-dasharray:4 3}
.band-wait{fill:var(--surface);stroke:var(--smalt);stroke-width:1.3;stroke-dasharray:1.5 3;stroke-linecap:round}
.tick-ev{fill:var(--ink-2)}.tick-rule{fill:var(--smalt)}.tick-dec{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}.tick-rest{fill:var(--bad)}
.link{stroke:var(--muted);stroke-width:1;fill:none}.link-dash{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:2 3}
.now{stroke:var(--ink);stroke-width:1.5}.surface{fill:var(--surface)}.ink{fill:var(--ink)}
.line-main{stroke:var(--teal-fill);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dot-main{fill:var(--teal-fill);stroke:var(--surface);stroke-width:2}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}.box-smalt{fill:var(--smalt-wash);stroke:var(--smalt);stroke-width:1}
.box-sunk{fill:var(--sunk);stroke:var(--line);stroke-width:1}.box-bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:1}
.arrow{stroke:var(--ink-2);stroke-width:1.3;fill:none}.arrowhead{fill:var(--ink-2)}
</style><rect width="520" height="470" rx="10" style="fill: var(--surface); stroke: var(--line)"/>
<defs>
<pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill: var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke: var(--smalt); stroke-width: 1.6; opacity: .38"/></pattern>
<marker id="ah3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrowhead"/></marker>
<marker id="ah3s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill: var(--smalt)"/></marker>
</defs>
<rect class="box-sunk" x="60" y="12" width="448" height="52" rx="9"/>
<text x="74" y="33" font-size="12.5" font-weight="600">Tue Mar 12 · going on</text>
<text class="t-2" x="74" y="51" font-size="11.5">The WAF on ing-east-3 put in monitor mode</text>
<path class="arrow" d="M32,38 V114" marker-end="url(#ah3)"/>
<path class="arrow" d="M32,38 H58"/>
<text class="t-mut" x="26" y="80" font-size="10" text-anchor="end" transform="rotate(-90 26 80)">led to</text>
<rect class="box-bad" x="60" y="88" width="448" height="52" rx="9"/>
<text x="74" y="109" font-size="12.5" font-weight="600">Tue Mar 12 · the day was held</text>
<text class="t-2" x="74" y="127" font-size="11.5">waf: the share failing far above its usual</text>
<path class="arrow" d="M32,114 V190" marker-end="url(#ah3)"/>
<path class="arrow" d="M32,114 H58"/>
<text class="t-mut" x="26" y="156" font-size="10" text-anchor="end" transform="rotate(-90 26 156)">answered by</text>
<rect class="box" x="60" y="164" width="448" height="52" rx="9"/>
<text x="74" y="185" font-size="12.5" font-weight="600">Tue Mar 12 · decided</text>
<text class="t-2" x="74" y="203" font-size="11.5">Published as is, because of the monitor mode</text>
<path class="arrow" d="M32,190 V266" marker-end="url(#ah3)"/>
<path class="arrow" d="M32,190 H58"/>
<text class="t-mut" x="26" y="232" font-size="10" text-anchor="end" transform="rotate(-90 26 232)">followed by</text>
<rect class="box" x="60" y="240" width="448" height="52" rx="9"/>
<text x="74" y="261" font-size="12.5" font-weight="600">Thu Mar 14 · decided by the security lead</text>
<text class="t-2" x="74" y="279" font-size="11.5">“Hold a WAF failing more than a tenth, from Monday”</text>
<path class="arrow" d="M32,266 V342" marker-end="url(#ah3)"/>
<path class="arrow" d="M32,266 H58"/>
<text class="t-mut" x="26" y="308" font-size="10" text-anchor="end" transform="rotate(-90 26 308)">written down</text>
<rect class="band-coming" x="60" y="316" width="448" height="52" rx="9"/>
<text x="74" y="337" font-size="12.5" font-weight="600">Fri Mar 15 · recorded: the business changed</text>
<text class="t-2" x="74" y="355" font-size="11.5">Tried on the last 7 days: Tue 12 would have been held</text>
<path class="arrow" d="M32,342 V418" marker-end="url(#ah3)"/>
<path class="arrow" d="M32,342 H58"/>
<text class="t-mut" x="26" y="384" font-size="10" text-anchor="end" transform="rotate(-90 26 384)">takes effect</text>
<rect class="box-smalt" x="60" y="392" width="448" height="52" rx="9"/>
<text x="74" y="413" font-size="12.5" font-weight="600">Mon Mar 18 · in force</text>
<text class="t-2" x="74" y="431" font-size="11.5">waf · share failing: held above a tenth</text>
<path class="arrow" d="M32,418 H58" marker-end="url(#ah3)"/>
</svg>
